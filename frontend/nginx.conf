server {
    listen 80;
    
    # Enable gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Headers de proxy (fora do if para evitar erro do Nginx)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Static index.html directly for backend fetch (avoid loop)
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|json|map|mp4|webm|mp3)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # robots/sitemap -> backend tenant-aware (no crawler-preview)
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    # All HTML / SPA routes -> backend crawlerPreview (dynamic per tenant, not static)
    location / {
        # proxy HTML to backend for tenant-aware meta injection
        rewrite ^(.*)$ /api/v1/public/crawler-preview?url=$scheme://$host$request_uri break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
        proxy_intercept_errors on;
        error_page 502 504 /index.html;
    }
}
